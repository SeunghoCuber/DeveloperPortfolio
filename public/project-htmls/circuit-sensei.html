<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuit Sensei – Agent Embed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; margin: 0; padding: 0; }

    /* ── Widget shell ── */
    #widget {
      width: 100%; max-width: 720px; height: 380px;
      background: #09090b;
      border-radius: 16px;
      border: 1px solid #27272a;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
      display: flex; flex-direction: column;
      overflow: hidden; position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Status bar ── */
    .sbar {
      height: 44px; background: #18181b; border-bottom: 1px solid #27272a;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; flex-shrink: 0;
    }
    .sbar-left  { display: flex; align-items: center; gap: 8px; }
    .sbar-icon  { color: #34d399; width: 16px; height: 16px; }
    .sbar-title { font-size: 13px; font-weight: 600; color: #fafafa; }
    .sbar-div   { width: 1px; height: 13px; background: #3f3f46; }
    .sbar-sub   { font-size: 11px; color: #71717a; }
    .sbar-right { display: flex; align-items: center; gap: 10px; }
    .mode-badge {
      padding: 2px 8px; background: #18181b; border: 1px solid #3f3f46;
      border-radius: 6px; display: flex; align-items: center; gap: 5px;
      font-size: 10px; color: #d4d4d8;
    }
    .mode-dot { width: 5px; height: 5px; background: #60a5fa; border-radius: 50%; animation: bpulse 2s infinite; }
    @keyframes bpulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .gemini-tag { font-size: 10px; color: #a78bfa; font-weight: 600; }

    /* ── Content row ── */
    .content { flex: 1; display: flex; overflow: hidden; }

    /* ── LEFT: Chat ── */
    .chat-panel {
      width: 256px; flex-shrink: 0; border-right: 1px solid #27272a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-msgs {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 10px 10px; display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: none;
    }
    .chat-msgs::-webkit-scrollbar { display: none; }

    /* Messages */
    .msg { display: flex; gap: 6px; align-items: flex-start; }
    .msg--user { flex-direction: row-reverse; }

    .msg-av {
      width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
      background: linear-gradient(135deg, #34d399, #059669);
      display: flex; align-items: center; justify-content: center;
    }
    .msg-av svg { width: 10px; height: 10px; }

    .msg-bub {
      background: #27272a; border-radius: 3px 9px 9px 9px;
      padding: 5px 9px; font-size: 11px; color: #d4d4d8;
      line-height: 1.45; max-width: 86%;
    }
    .msg--user .msg-bub {
      background: #052e16; border: 1px solid #065f46;
      color: #6ee7b7; border-radius: 9px 3px 9px 9px;
    }

    /* Tool card */
    .tool-card {
      background: #18181b; border: 1px solid #27272a;
      border-radius: 7px; overflow: hidden; margin-top: 3px; max-width: 100%;
    }
    .tool-head {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px; border-bottom: 1px solid #27272a;
    }
    .tool-lbl { font-size: 10px; font-weight: 600; color: #a1a1aa; flex: 1; }
    .tool-sts { font-size: 10px; font-weight: 600; }
    .sts-run { color: #60a5fa; }
    .sts-ok  { color: #34d399; }
    .tool-body { padding: 4px 8px; font-size: 10px; color: #52525b; }
    .tool-spinner { display: flex; gap: 3px; padding: 2px 0; }
    .tool-spinner span {
      width: 4px; height: 4px; border-radius: 50%; background: #60a5fa;
      animation: sdot 1.2s infinite;
    }
    .tool-spinner span:nth-child(2) { animation-delay:.2s }
    .tool-spinner span:nth-child(3) { animation-delay:.4s }
    @keyframes sdot { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

    /* Typing indicator */
    .typing { display: flex; gap: 3px; padding: 3px 1px; }
    .tydot {
      width: 5px; height: 5px; border-radius: 50%; background: #34d399;
      animation: tybounce 1.2s infinite;
    }
    .tydot:nth-child(2){animation-delay:.2s}
    .tydot:nth-child(3){animation-delay:.4s}
    @keyframes tybounce {
      0%,60%,100%{transform:translateY(0);opacity:.35}
      30%{transform:translateY(-4px);opacity:1}
    }

    /* Input bar */
    .chat-input {
      border-top: 1px solid #27272a;
      padding: 7px 9px; flex-shrink: 0;
      display: flex; align-items: center; gap: 5px;
    }
    .input-box {
      flex: 1; background: #18181b; border: 1px solid #3f3f46;
      border-radius: 7px; padding: 4px 9px;
      font-size: 10.5px; color: #a1a1aa;
      min-height: 26px; display: flex; align-items: center;
      transition: border-color .2s;
    }
    .input-box.on { border-color: #34d399; color: #fafafa; }
    .input-ph { color: #3f3f46; }
    .icursor {
      display: inline-block; width: 1.5px; height: 11px;
      background: #34d399; margin-left: 1px; vertical-align: middle;
      animation: icblink .7s infinite;
    }
    @keyframes icblink { 0%,100%{opacity:1} 50%{opacity:0} }
    .send-btn {
      width: 26px; height: 26px; border-radius: 7px; border: none;
      background: #34d399; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .2s; flex-shrink: 0;
    }
    .send-btn.dim { opacity: .28; }
    .send-btn svg { width: 10px; height: 10px; color: #09090b; }

    /* ── RIGHT panel ── */
    .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Steps section */
    .steps-sec {
      height: 50%; border-bottom: 1px solid #27272a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .steps-hdr {
      padding: 5px 11px; border-bottom: 1px solid #27272a;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .steps-hdr-l { display: flex; align-items: center; gap: 5px; }
    .steps-hdr-l svg { width: 11px; height: 11px; color: #34d399; }
    .steps-hdr-title { font-size: 10.5px; font-weight: 600; color: #d4d4d8; }
    .steps-hdr-count { font-size: 9.5px; color: #52525b; }
    .steps-body { flex: 1; padding: 7px 10px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }

    /* Step cards */
    .step-card {
      border-radius: 8px; padding: 6px 9px;
      transition: opacity .4s, border-color .4s;
    }
    .step-card--cur {
      background: #111; border: 1px solid #34d399;
    }
    .step-card--nxt {
      background: #18181b; border: 1px solid #27272a; opacity: .55;
    }
    .step-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .step-badge {
      font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .badge-cur { background: #34d399; color: #09090b; }
    .badge-nxt { background: #27272a; color: #52525b; }
    .step-desc { font-size: 10.5px; color: #d4d4d8; line-height: 1.4; }
    .step-card--nxt .step-desc { color: #3f3f46; }

    /* Verification rows */
    .step-verif { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
    .verif-row { display: flex; align-items: center; gap: 5px; font-size: 9.5px; }
    .verif-icon { font-size: 10px; flex-shrink: 0; }
    .verif-lbl  { color: #52525b; flex: 1; }
    .verif-ok   { color: #34d399; font-weight: 600; }
    .verif-run  { color: #60a5fa; }
    .verif-idle { color: #27272a; }

    /* Board section */
    .board-sec { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .board-hdr {
      padding: 5px 11px; border-bottom: 1px solid #27272a;
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .board-hdr svg { width: 10px; height: 10px; color: #facc15; }
    .board-hdr-title { font-size: 10px; font-weight: 600; color: #d4d4d8; }
    .board-live { margin-left: auto; width: 5px; height: 5px; border-radius: 50%; background: #34d399; animation: bpulse 2s infinite; }
    .board-content { flex: 1; display: flex; overflow: hidden; }
    .board-img-wrap {
      flex: 1; padding: 6px 8px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .board-img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; border-radius: 6px;
      background: #18181b; transition: opacity .45s ease;
    }
    .cam-wrap {
      flex: 1; border-left: 1px solid #27272a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .cam-label {
      padding: 3px 8px; border-bottom: 1px solid #27272a; flex-shrink: 0;
      display: flex; align-items: center; gap: 4px;
      font-size: 9px; font-weight: 600; color: #52525b;
    }
    .cam-label-dot { width: 4px; height: 4px; border-radius: 50%; background: #f87171; animation: bpulse 2s infinite; }
    .cam-video-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; padding: 4px 6px;
    }
    .cam-video-wrap video {
      width: 100%; height: 100%; object-fit: cover; border-radius: 5px;
    }

    /* Fade overlay */
    .fade-ov {
      position: absolute; inset: 0; background: #09090b;
      opacity: 0; pointer-events: none;
      transition: opacity .55s ease;
      border-radius: 16px; z-index: 10;
    }

    @keyframes slideIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    .si { animation: slideIn .22s ease forwards; }
  </style>
</head>
<body>

<div id="widget">
  <div class="fade-ov" id="fadeOv"></div>

  <!-- Status bar -->
  <div class="sbar">
    <div class="sbar-left">
      <svg class="sbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
        <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
        <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
        <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/>
        <line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>
      </svg>
      <span class="sbar-title">Circuit Sensei</span>
      <div class="sbar-div"></div>
      <span class="sbar-sub">Agentic Breadboard Assistant</span>
    </div>
    <div class="sbar-right">
      <div class="mode-badge"><div class="mode-dot"></div><span>instruct</span></div>
      <span class="gemini-tag">Gemini</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- LEFT: Chat -->
    <div class="chat-panel">
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-input">
        <div class="input-box" id="inputBox">
          <span id="inputText"><span class="input-ph">Describe your circuit…</span></span>
          <span class="icursor" id="icursor" style="display:none;"></span>
        </div>
        <button class="send-btn dim" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">

      <!-- Steps -->
      <div class="steps-sec">
        <div class="steps-hdr">
          <div class="steps-hdr-l">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            </svg>
            <span class="steps-hdr-title">Assembly Instructions</span>
          </div>
          <span class="steps-hdr-count" id="stepCount">0 / 4 done</span>
        </div>
        <div class="steps-body" id="stepsBody"></div>
      </div>

      <!-- Board -->
      <div class="board-sec">
        <div class="board-hdr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span class="board-hdr-title">Breadboard Layout</span>
          <div class="board-live"></div>
        </div>
        <div class="board-content">
          <div class="board-img-wrap">
            <img class="board-img" id="boardImg" src="/arduino_uno.png" alt="Breadboard" />
          </div>
          <div class="cam-wrap">
            <div class="cam-label">
              <div class="cam-label-dot"></div>
              <span>Camera Feed</span>
            </div>
            <div class="cam-video-wrap">
              <video id="camVideo" autoplay muted playsinline src="/circuit-sensei-camera.mp4"></video>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ── Refs ──────────────────────────────────────────────────────────────────────
const chatMsgs  = document.getElementById('chatMsgs')
const inputBox  = document.getElementById('inputBox')
const inputText = document.getElementById('inputText')
const icursor   = document.getElementById('icursor')
const sendBtn   = document.getElementById('sendBtn')
const stepsBody = document.getElementById('stepsBody')
const stepCount = document.getElementById('stepCount')
const boardImg  = document.getElementById('boardImg')
const fadeOv    = document.getElementById('fadeOv')
const camVideo  = document.getElementById('camVideo')

let timers = []
const wait = ms => new Promise(r => { const t = setTimeout(r, ms); timers.push(t) })
const clearAll = () => { timers.forEach(clearTimeout); timers = [] }

// ── Data ──────────────────────────────────────────────────────────────────────
const STEPS = [
  {
    num: 1,
    desc: 'Place a 220Ω resistor from A10 to A17',
    userMsg: 'Done, placed the resistor!',
    cameraResult: 'Resistor confirmed at A10–A17 · 218Ω ±1%',
    arduinoResult: 'A10→A17 · continuity OK · 0.4Ω',
    doneMsg: '✓ Step 1 complete. Now insert the LED.',
    image: '/arduino_uno_0.png',
  },
  {
    num: 2,
    desc: 'Connect LED — anode at C17, cathode at D18',
    userMsg: 'LED is in',
    cameraResult: 'LED detected — anode C17, cathode D18',
    arduinoResult: 'Forward voltage 2.1V — LED viable',
    doneMsg: '✓ Step 2 done. Connect Pin 9 next.',
    image: '/arduino_uno_1.png',
  },
  {
    num: 3,
    desc: 'Connect Digital Pin 9 to B10 with a jumper',
    userMsg: 'Jumper connected',
    cameraResult: 'Jumper wire: D-Pin 9 → B10 confirmed',
    arduinoResult: 'Signal path D9→B10 active · 4.97V',
    doneMsg: '✓ Step 3 done. One more — ground it.',
    image: '/arduino_uno_2.png',
  },
  {
    num: 4,
    desc: 'Connect GND pin to B17',
    userMsg: 'Done! All connected',
    cameraResult: 'GND wire: GND pin → B17 confirmed',
    arduinoResult: 'Ground loop closed · circuit complete',
    doneMsg: '🎉 All steps done! Running LED blink test…',
    image: '/arduino_uno_3.png',
  },
]

// ── Agent avatar HTML ─────────────────────────────────────────────────────────
function av() {
  return `<div class="msg-av">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
      <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
    </svg>
  </div>`
}

// ── Chat helpers ──────────────────────────────────────────────────────────────
function addMsg(html, cls = 'msg--ai') {
  const el = document.createElement('div')
  el.className = `msg ${cls} si`
  el.innerHTML = html
  chatMsgs.appendChild(el)
  chatMsgs.scrollTop = chatMsgs.scrollHeight
  return el
}

function addAgentMsg(text) {
  return addMsg(`${av()}<div class="msg-bub">${text}</div>`)
}

function typingEl() {
  return addMsg(`${av()}<div class="msg-bub"><div class="typing"><div class="tydot"></div><div class="tydot"></div><div class="tydot"></div></div></div>`)
}

// Tool card — returns element so we can update it
function addToolCard(icon, label) {
  const wrapper = document.createElement('div')
  wrapper.className = `msg msg--ai si`
  wrapper.innerHTML = `${av()}<div class="msg-bub" style="padding:0;background:#18181b;border:1px solid #27272a;border-radius:3px 9px 9px 9px;overflow:hidden;">
    <div class="tool-head">
      <span style="font-size:10px;">${icon}</span>
      <span class="tool-lbl">${label}</span>
      <span class="tool-sts sts-run" id="tsts-${label.replace(/\s/g,'')}">running…</span>
    </div>
    <div class="tool-body" id="tbody-${label.replace(/\s/g,'')}">
      <div class="tool-spinner"><span></span><span></span><span></span></div>
    </div>
  </div>`
  chatMsgs.appendChild(wrapper)
  chatMsgs.scrollTop = chatMsgs.scrollHeight
  const stsEl  = wrapper.querySelector(`#tsts-${label.replace(/\s/g,'')}`)
  const bodyEl = wrapper.querySelector(`#tbody-${label.replace(/\s/g,'')}`)
  return { stsEl, bodyEl }
}

function resolveCard(stsEl, bodyEl, result) {
  stsEl.textContent = '✓ passed'
  stsEl.className = 'tool-sts sts-ok'
  bodyEl.style.color = '#34d399'
  bodyEl.textContent = result
}

// ── Input typewriter ──────────────────────────────────────────────────────────
async function typeInput(text) {
  inputText.textContent = ''
  inputBox.classList.add('on')
  icursor.style.display = 'inline-block'
  sendBtn.classList.remove('dim')
  for (let i = 0; i <= text.length; i++) {
    inputText.textContent = text.slice(0, i)
    await wait(i === 0 ? 80 : 46 + Math.random() * 26)
  }
  await wait(300)
}

// ── Board image crossfade ─────────────────────────────────────────────────────
async function switchBoard(src) {
  boardImg.style.opacity = '0'
  await wait(450)
  boardImg.src = src
  boardImg.style.opacity = '1'
}

// ── Step panel renderer ───────────────────────────────────────────────────────
function renderSteps(curIdx, verifState) {
  // verifState: { camera: 'idle'|'run'|'ok', arduino: 'idle'|'run'|'ok' }
  const cur  = STEPS[curIdx]
  const next = STEPS[curIdx + 1]

  const verifRow = (icon, label, state) => {
    const cls = state === 'ok' ? 'verif-ok' : state === 'run' ? 'verif-run' : 'verif-idle'
    const txt = state === 'ok' ? '✓ verified' : state === 'run' ? 'running…' : '—'
    return `<div class="verif-row">
      <span class="verif-icon">${icon}</span>
      <span class="verif-lbl">${label}</span>
      <span class="${cls}">${txt}</span>
    </div>`
  }

  const curCard = `<div class="step-card step-card--cur">
    <div class="step-card-top">
      <span class="step-badge badge-cur">Step ${cur.num}</span>
    </div>
    <div class="step-desc">${cur.desc}</div>
    <div class="step-verif">
      ${verifRow('📷', 'Gemini Vision', verifState.camera)}
      ${verifRow('⚡', 'Arduino Test',  verifState.arduino)}
    </div>
  </div>`

  const nxtCard = next ? `<div class="step-card step-card--nxt">
    <div class="step-card-top">
      <span class="step-badge badge-nxt">Step ${next.num}</span>
    </div>
    <div class="step-desc">${next.desc}</div>
  </div>` : ''

  stepsBody.innerHTML = curCard + nxtCard
  stepCount.textContent = `${curIdx} / 4 done`
}

// ── Main loop ─────────────────────────────────────────────────────────────────
async function runLoop() {
  // Reset state
  chatMsgs.innerHTML = ''
  boardImg.src = '/arduino_uno.png'
  boardImg.style.opacity = '1'
  camVideo.currentTime = 0
  camVideo.play()

  // Initial agent greeting
  addAgentMsg("Hi! Let's build an LED blink circuit. Follow each step — I'll verify with Gemini Vision and Arduino tests.")
  await wait(600)
  renderSteps(0, { camera: 'idle', arduino: 'idle' })
  stepCount.textContent = '0 / 4 done'

  for (let i = 0; i < STEPS.length; i++) {
    const s = STEPS[i]

    // User types their reply
    await wait(800)
    await typeInput(s.userMsg)

    // Send
    icursor.style.display = 'none'
    inputBox.classList.remove('on')
    sendBtn.classList.add('dim')
    inputText.innerHTML = '<span class="input-ph">Describe your circuit…</span>'
    addMsg(`<div class="msg-bub">${s.userMsg}</div>`, 'msg--user')
    await wait(260)

    // Agent typing
    const t1 = typingEl()
    await wait(700)
    t1.remove()

    // Camera check
    renderSteps(i, { camera: 'run', arduino: 'idle' })
    const cam = addToolCard('📷', 'Gemini Vision')
    await wait(1000)
    resolveCard(cam.stsEl, cam.bodyEl, s.cameraResult)
    renderSteps(i, { camera: 'ok', arduino: 'idle' })
    await wait(380)

    // Arduino test
    renderSteps(i, { camera: 'ok', arduino: 'run' })
    const ard = addToolCard('⚡', 'Arduino Test')
    await wait(1050)
    resolveCard(ard.stsEl, ard.bodyEl, s.arduinoResult)
    renderSteps(i, { camera: 'ok', arduino: 'ok' })
    await wait(380)

    // Step done message
    const t2 = typingEl()
    await wait(600)
    t2.remove()
    addAgentMsg(s.doneMsg)

    // Board image crossfade
    switchBoard(s.image)

    // Advance step panel
    await wait(500)
    stepCount.textContent = `${i + 1} / 4 done`

    if (i < STEPS.length - 1) {
      renderSteps(i + 1, { camera: 'idle', arduino: 'idle' })
    } else {
      // All done — show final result
      stepsBody.innerHTML = `<div class="step-card step-card--cur" style="border-color:#34d399;">
        <div class="step-card-top"><span class="step-badge badge-cur">✓ Complete</span></div>
        <div class="step-desc" style="color:#34d399;">LED blink circuit assembled &amp; verified!</div>
      </div>`
    }

    await wait(700)
  }

  // Final blink test message
  await wait(400)
  const t3 = typingEl()
  await wait(800)
  t3.remove()
  addAgentMsg('✅ LED blinks at 1 Hz — circuit verified! Great work.')
  await wait(3500)

  // Fade out → loop
  fadeOv.style.opacity = '1'
  await wait(600)
  stepsBody.innerHTML = ''
  fadeOv.style.opacity = '0'
  await wait(500)

  runLoop()
}

setTimeout(runLoop, 500)
</script>

</body>
</html>
